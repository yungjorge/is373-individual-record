services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stoic
      POSTGRES_DB: stoic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stoic -d stoic"]
      interval: 5s
      timeout: 5s
      retries: 15
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports: ["127.0.0.1:${QDRANT_PORT:-6333}:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/6333
          printf 'GET /readyz HTTP/1.0\r\n\r\n' >&3
          read -r response <&3
          [[ "$$response" == *" 200 "* ]]
      interval: 10s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://stoic:${POSTGRES_PASSWORD}@postgres:5432/stoic
      QDRANT_URL: http://qdrant:6333
    depends_on:
      postgres: {condition: service_healthy}
    command: ["alembic", "upgrade", "head"]
  ingest:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://stoic:${POSTGRES_PASSWORD}@postgres:5432/stoic
      QDRANT_URL: http://qdrant:6333
    volumes: ["app-data:/workspace/backend/data"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      qdrant: {condition: service_healthy}
    command: ["python", "-m", "app.ingestion", "ingest", "--all"]
    restart: on-failure:3
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://stoic:${POSTGRES_PASSWORD}@postgres:5432/stoic
      QDRANT_URL: http://qdrant:6333
    ports: ["127.0.0.1:${BACKEND_PORT:-8000}:8000"]
    volumes: ["app-data:/workspace/backend/data"]
    depends_on:
      ingest: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready')"]
      interval: 15s
      timeout: 10s
      retries: 5
  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_AUTH0_DOMAIN: ${NEXT_PUBLIC_AUTH0_DOMAIN:-}
        NEXT_PUBLIC_AUTH0_CLIENT_ID: ${NEXT_PUBLIC_AUTH0_CLIENT_ID:-}
        NEXT_PUBLIC_AUTH0_AUDIENCE: ${NEXT_PUBLIC_AUTH0_AUDIENCE:-}
    ports: ["127.0.0.1:${FRONTEND_PORT:-3000}:3000"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 5
volumes:
  postgres-data:
  qdrant-data:
  app-data:
