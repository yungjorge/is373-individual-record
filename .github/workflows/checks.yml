name: Record and application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python scripts/check_docs.py
      - run: npx --yes prettier@3.6.2 --check README.md 'docs/*.md'
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stoic-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest -q
      - run: python ../../scripts/worked_trace.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/stoic-companion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/stoic-companion/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m app.ingestion ingest --all
      - run: npm ci
        working-directory: projects/stoic-companion/frontend
      - run: npm run lint && npm run build
        working-directory: projects/stoic-companion/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: projects/stoic-companion/frontend
      - run: npm run test:e2e
        working-directory: projects/stoic-companion/frontend
