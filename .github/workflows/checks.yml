name: Record and application checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python scripts/check_docs.py
      - run: npx --yes prettier@3.6.2 --check README.md 'docs/*.md'
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/stoic-companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: pytest -q
      - run: python ../../scripts/worked_trace.py
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: projects/stoic-companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/stoic-companion/frontend/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: PYTHONPATH=backend python -m app.ingestion ingest --all
      - run: npm ci
        working-directory: projects/stoic-companion/frontend
      - run: npm run lint && npm run build
        working-directory: projects/stoic-companion/frontend
      - run: npx playwright install --with-deps chromium
        working-directory: projects/stoic-companion/frontend
      - run: npm run test:e2e
        working-directory: projects/stoic-companion/frontend
